<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8">
</head>
<body>
    <div class="expdiv1">
    <button onclick="tomainpage()" class="button">redirect to main page</button>
    <button onclick="redirectlogin()" class="button">redirect to login page</button>
    <button onclick="todatapage()" class="button">redirect to data page</button>
        <script src="main.js"></script>
    <div class="login-box">
        <form action="main.go/Register" method="post">
            <h2>Login</h2>
            <div class="input-box">
                <span class="icon"></span>
                <input name="username" type="email" required>
                <label>Email</label> 
            </div>
            <div class="input-box">
                <span class="icon"></span>
                <input name="password" type="password" required>
                <label>Password</label>
            </div>
            <div class="remember-forget">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            
            </div>
        </form>
    </div>
</div>
</body>
</html>
